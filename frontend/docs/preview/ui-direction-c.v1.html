<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEO Studio — 方案 C 完整预览</title>
    <style>
      :root {
        --bg: #f3f4f7;
        --surface: #ffffff;
        --text: #12141a;
        --muted: rgba(18, 20, 26, 0.45);
        --faint: rgba(18, 20, 26, 0.32);
        --line: rgba(18, 20, 26, 0.06);
        --accent: #4f46e5;
        --accent-soft: rgba(79, 70, 229, 0.1);
        --radius: 16px;
        --shadow: 0 1px 2px rgba(18, 20, 26, 0.05);
        --sidebar: 212px;

        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --accent-grad: linear-gradient(135deg, #6366f1 0%, #4f46e5 55%, #7c3aed 100%);
        --shadow-sm: 0 1px 2px rgba(18, 20, 26, 0.05), 0 1px 1px rgba(18, 20, 26, 0.03);
        --shadow-md: 0 10px 28px -12px rgba(18, 20, 26, 0.18), 0 2px 6px rgba(18, 20, 26, 0.04);
        --shadow-lg: 0 28px 70px -24px rgba(30, 27, 75, 0.32);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select, textarea { font: inherit; color: inherit; }
      button { border: 0; background: none; cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      svg { display: block; }

      .app { display: flex; min-height: 100vh; }

      /* ---------- sidebar ---------- */
      .sidebar {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        width: var(--sidebar);
        height: 100vh;
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--line);
        transition: width 0.18s ease;
        overflow: hidden;
      }

      .brand { display: flex; align-items: center; gap: 10px; padding: 16px; }

      .logo {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border-radius: 11px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }

      .brand-text { font-size: 14px; font-weight: 600; white-space: nowrap; }
      .brand-sub { display: block; margin-top: 1px; font-size: 10px; font-weight: 400; color: var(--faint); }

      .nav { flex: 1; padding: 8px; overflow-y: auto; }

      .nav-group {
        margin: 14px 8px 6px;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--faint);
        text-transform: uppercase;
        white-space: nowrap;
      }

      .nav-group:first-child { margin-top: 4px; }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 10px;
        border-radius: 10px;
        color: rgba(18, 20, 26, 0.58);
        font-size: 13px;
        white-space: nowrap;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
      .nav-item:hover { background: rgba(18, 20, 26, 0.04); color: var(--text); }
      .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

      .sidebar-foot { padding: 8px; border-top: 1px solid var(--line); }

      .collapse-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 32px;
        padding: 0 10px;
        border-radius: 9px;
        color: var(--faint);
        font-size: 12px;
        white-space: nowrap;
      }

      .collapse-btn:hover { background: rgba(18, 20, 26, 0.04); color: var(--text); }
      .collapse-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

      .user-box {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
        padding: 8px 10px;
        border-radius: 10px;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        border-radius: 999px;
        background: rgba(18, 20, 26, 0.06);
        color: rgba(18, 20, 26, 0.6);
        font-size: 11px;
      }

      .user-meta { min-width: 0; }
      .user-meta b { display: block; font-size: 12px; font-weight: 500; white-space: nowrap; }
      .user-meta small { display: block; font-size: 10px; color: var(--faint); white-space: nowrap; }

      .logout {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 30px;
        padding: 0 10px;
        border-radius: 9px;
        color: var(--faint);
        font-size: 12px;
        white-space: nowrap;
      }

      .logout:hover { background: rgba(18, 20, 26, 0.04); color: #dc2626; }
      .logout svg { width: 16px; height: 16px; flex-shrink: 0; }

      body.collapsed .sidebar { width: 64px; }
      body.collapsed .brand { justify-content: center; padding: 16px 0; }
      body.collapsed .brand-text,
      body.collapsed .nav-group,
      body.collapsed .nav-item span,
      body.collapsed .collapse-btn span,
      body.collapsed .user-meta,
      body.collapsed .logout span { display: none; }
      body.collapsed .nav-item,
      body.collapsed .collapse-btn,
      body.collapsed .logout,
      body.collapsed .user-box { justify-content: center; padding: 0; }
      body.collapsed .user-box { padding: 8px 0; }

      /* ---------- main ---------- */
      .main { flex: 1; min-width: 0; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        padding: 0 20px;
        background: rgba(255, 255, 255, 0.75);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
      .crumbs b { color: var(--text); font-weight: 500; }
      .crumbs .sep { color: rgba(18, 20, 26, 0.2); }

      .topbar-right { display: flex; align-items: center; gap: 10px; }

      .search {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(18, 20, 26, 0.04);
        color: var(--muted);
        font-size: 12px;
      }

      .search svg { width: 14px; height: 14px; }
      .search kbd { margin-left: 24px; padding: 0 4px; border: 1px solid rgba(18, 20, 26, 0.1); border-radius: 4px; font-family: inherit; font-size: 10px; color: var(--faint); }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        color: var(--faint);
        transition: background 0.15s ease, color 0.15s ease;
      }

      .icon-btn:hover { background: rgba(18, 20, 26, 0.05); color: var(--text); }
      .icon-btn svg { width: 16px; height: 16px; }

      .content { padding: 20px 20px 96px; }

      .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
      .page-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .page-head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

      /* ---------- buttons ---------- */
      .primary-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 13px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 500;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .primary-btn:hover { transform: translateY(-1px); opacity: 0.95; }
      .primary-btn svg { width: 14px; height: 14px; }

      .ghost-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 13px;
        border: 1px solid rgba(18, 20, 26, 0.1);
        border-radius: 10px;
        background: var(--surface);
        font-size: 12px;
        color: rgba(18, 20, 26, 0.62);
        transition: background 0.15s ease;
      }

      .ghost-btn:hover { background: rgba(18, 20, 26, 0.03); }
      .ghost-btn svg { width: 14px; height: 14px; }

      .segmented {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
        font-size: 12px;
      }

      .segmented button { padding: 6px 12px; border-radius: 8px; color: var(--muted); }
      .segmented .on { background: rgba(18, 20, 26, 0.05); color: var(--text); font-weight: 500; }

      /* ---------- tiles / bento ---------- */
      .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
      .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
      .hero { grid-column: span 8; background: linear-gradient(135deg, #fff 0%, #eef0ff 100%); }
      .kpi-grid { grid-column: span 4; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .status { grid-column: span 4; }
      .recent { grid-column: span 8; }

      .hero-head { display: flex; align-items: flex-start; justify-content: space-between; }
      .eyebrow { margin: 0; font-size: 13px; color: var(--muted); }
      .hero-value { margin: 4px 0 0; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .pill { padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: #3730a3; font-size: 12px; font-weight: 500; }
      .chart { margin-top: 16px; }
      .chart svg { width: 100%; height: 190px; }
      .line { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: draw 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s forwards; }

      .kpi { padding: 16px; transition: transform 0.2s ease; }
      .kpi:hover { transform: translateY(-2px); }
      .kpi .label { margin: 0; font-size: 12px; color: var(--muted); }
      .kpi .value { margin: 8px 0 0; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .kpi .delta { margin: 4px 0 0; font-size: 11px; }
      .up { color: #059669; }
      .down { color: #f43f5e; }

      .tile-head { display: flex; align-items: center; justify-content: space-between; }
      .tile-head h2 { margin: 0; font-size: 14px; font-weight: 500; }
      .tile-head svg { width: 16px; height: 16px; color: var(--accent); }
      .link { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); transition: color 0.15s ease; }
      .link:hover { color: var(--text); }
      .link svg { width: 14px; height: 14px; }

      .status-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 36px; align-items: center; gap: 12px; margin-top: 12px; }
      .status-row .name { font-size: 12px; color: rgba(18, 20, 26, 0.55); }
      .status-row .num { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      .track { height: 6px; overflow: hidden; border-radius: 999px; background: rgba(18, 20, 26, 0.05); }
      .track i { display: block; height: 100%; width: 0; border-radius: 999px; animation: grow 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.25s forwards; }

      .recent-list { list-style: none; margin: 8px 0 0; padding: 0; }
      .recent-list li { display: flex; align-items: center; gap: 16px; padding: 12px 8px; border-top: 1px solid var(--line); transition: background 0.15s ease; }
      .recent-list li:hover { background: rgba(18, 20, 26, 0.02); }
      .recent-title { flex: 1; min-width: 0; }
      .recent-title b { display: block; overflow: hidden; font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .recent-title small { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); }
      .score { width: 40px; flex-shrink: 0; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }

      .tag { flex-shrink: 0; padding: 2px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
      .t-green { background: #ecfdf5; color: #047857; }
      .t-indigo { background: #eef2ff; color: #4338ca; }
      .t-amber { background: #fffbeb; color: #b45309; }
      .t-gray { background: rgba(18, 20, 26, 0.05); color: rgba(18, 20, 26, 0.45); }
      .t-rose { background: #fff1f2; color: #be123c; }

      /* ---------- table ---------- */
      .panel { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
      .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
      .panel-head h2 { margin: 0; font-size: 14px; font-weight: 500; }

      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .input, .select {
        height: 34px;
        padding: 0 10px;
        border: 1px solid rgba(18, 20, 26, 0.1);
        border-radius: 9px;
        background: var(--surface);
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .input::placeholder { color: var(--faint); }

      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      thead th {
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(18, 20, 26, 0.015);
        font-size: 11px;
        font-weight: 500;
        text-align: left;
        color: var(--muted);
        white-space: nowrap;
      }
      tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      tbody tr { transition: background 0.15s ease; }
      tbody tr:hover { background: rgba(18, 20, 26, 0.02); }
      tbody tr:last-child td { border-bottom: 0; }
      tr.clickable { cursor: pointer; }
      .cell-title b { display: block; font-weight: 500; }
      .cell-title small { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); }
      .num-cell { text-align: right; font-variant-numeric: tabular-nums; }
      .row-action { color: var(--faint); font-size: 12px; }
      .row-action:hover { color: var(--accent); }

      .pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
      .pages { display: flex; gap: 4px; }
      .pages button { min-width: 28px; height: 28px; border-radius: 8px; font-size: 12px; color: var(--muted); }
      .pages button:hover { background: rgba(18, 20, 26, 0.04); }
      .pages .on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

      /* ---------- studio ---------- */
      .studio { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; margin-top: 20px; align-items: start; }
      .studio-main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
      .studio-col { display: flex; flex-direction: column; gap: 16px; }
      .panel-title { margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

      .agent-list { display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; }
      .agent {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        padding: 8px 6px;
        border-radius: 9px;
        text-align: left;
        transition: background 0.15s ease;
      }
      .agent:hover { background: rgba(18, 20, 26, 0.03); }
      .agent.active { background: var(--accent-soft); }
      .agent-dot { display: grid; place-items: center; width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; background: rgba(18, 20, 26, 0.05); color: var(--muted); }
      .agent.active .agent-dot { background: var(--accent); color: #fff; }
      .agent b { display: block; font-size: 12px; font-weight: 500; }
      .agent small { display: block; margin-top: 1px; font-size: 10px; color: var(--faint); }

      .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field label { font-size: 11px; color: var(--muted); }
      .field .input, .field .select { width: 100%; height: 32px; }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: rgba(18, 20, 26, 0.05); font-size: 11px; color: rgba(18, 20, 26, 0.65); }
      .chip button { color: var(--faint); font-size: 13px; line-height: 1; }
      .chip button:hover { color: #be123c; }

      .range-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .range-row input[type="range"] { flex: 1; accent-color: var(--accent); }
      .range-row output { width: 52px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }

      .upload {
        display: grid;
        place-items: center;
        gap: 4px;
        margin-top: 8px;
        padding: 18px 10px;
        border: 1px dashed rgba(18, 20, 26, 0.16);
        border-radius: 12px;
        text-align: center;
        color: var(--faint);
        font-size: 11px;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .upload:hover { border-color: var(--accent); background: var(--accent-soft); }

      .canvas-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
      .canvas-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
      .canvas-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--faint); }

      .prose { max-width: 820px; margin: 0 auto; padding: 26px 8px 10px; }
      .prose h3 { margin: 22px 0 8px; font-size: 16px; font-weight: 600; }
      .prose p { margin: 0 0 14px; font-size: 14.5px; line-height: 1.9; color: rgba(18, 20, 26, 0.78); }
      .prose .lead { font-size: 15px; color: rgba(18, 20, 26, 0.9); }
      .prose blockquote { margin: 18px 0; padding: 10px 16px; border-left: 2px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; font-size: 13px; color: rgba(18, 20, 26, 0.7); }

      .canvas-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
      .canvas-foot .hint { font-size: 11px; color: var(--faint); }

      .ring { width: 104px; height: 104px; margin: 4px auto 0; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), rgba(18, 20, 26, 0.07) 0); display: grid; place-items: center; }
      .ring-inner { display: grid; place-items: center; width: 82px; height: 82px; border-radius: 50%; background: var(--surface); text-align: center; }
      .ring-inner b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
      .ring-inner small { margin-top: 3px; font-size: 10px; color: var(--faint); }

      .grade { display: block; margin: 10px auto 0; width: fit-content; padding: 2px 10px; border-radius: 999px; background: #ecfdf5; color: #047857; font-size: 11px; }

      .dim { margin-top: 12px; }
      .dim-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
      .dim-head b { font-weight: 500; color: var(--text); }
      .dim .track { height: 5px; margin-top: 5px; }
      .dim .track i { animation: none; width: var(--w); }

      .coverage { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
      .coverage b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .coverage span { font-size: 11px; color: var(--faint); }

      /* ---------- settings ---------- */
      .settings { display: grid; grid-template-columns: 190px minmax(0, 1fr) 280px; gap: 16px; margin-top: 20px; align-items: start; }
      .subnav { display: flex; flex-direction: column; gap: 2px; }
      .subnav button { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 9px; font-size: 13px; color: var(--muted); text-align: left; }
      .subnav button:hover { background: rgba(18, 20, 26, 0.04); }
      .subnav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

      .form { display: flex; flex-direction: column; gap: 16px; }
      .form-row { display: flex; flex-direction: column; gap: 6px; }
      .form-row label { font-size: 12px; font-weight: 500; }
      .form-row .hint { font-size: 11px; color: var(--faint); }
      textarea.input { height: auto; min-height: 160px; padding: 10px; resize: vertical; line-height: 1.7; }
      .save-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
      .save-bar span { font-size: 11px; color: var(--faint); }

      /* ---------- roles ---------- */
      .roles { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; margin-top: 20px; align-items: start; }
      .role-list { display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; }
      .role { display: flex; align-items: center; justify-content: space-between; padding: 9px 8px; border-radius: 9px; font-size: 13px; color: rgba(18, 20, 26, 0.68); text-align: left; }
      .role:hover { background: rgba(18, 20, 26, 0.03); }
      .role.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
      .role small { font-size: 10px; font-weight: 400; color: var(--faint); }

      .perm-group { margin-top: 16px; }
      .perm-group h3 { margin: 0 0 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
      .perm { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: rgba(18, 20, 26, 0.72); }
      .perm input { width: 15px; height: 15px; accent-color: var(--accent); }

      /* ---------- drawer / modal / toast ---------- */
      .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(18, 20, 26, 0.28); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
      .overlay.open { opacity: 1; pointer-events: auto; }

      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        width: 480px;
        max-width: 92vw;
        height: 100vh;
        background: var(--surface);
        border-left: 1px solid var(--line);
        box-shadow: -16px 0 48px rgba(18, 20, 26, 0.12);
        transform: translateX(100%);
        transition: transform 0.2s ease;
      }
      .drawer.open { transform: translateX(0); }
      .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; }
      .drawer-head h2 { margin: 2px 0 0; font-size: 17px; font-weight: 600; }
      .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }

      .tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line); }
      .tab { padding: 9px 10px; border-bottom: 2px solid transparent; font-size: 12px; color: var(--muted); }
      .tab:hover { color: var(--text); }
      .tab.on { border-color: var(--accent); color: var(--accent); font-weight: 500; }

      .kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px 14px; font-size: 13px; }
      .kv dt { color: var(--faint); }
      .kv dd { margin: 0; }

      .modal-root { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 24px; background: rgba(18, 20, 26, 0.3); }
      .modal-root.open { display: grid; }
      .modal-card { width: 100%; max-width: 460px; background: var(--surface); border-radius: 18px; box-shadow: 0 24px 64px rgba(18, 20, 26, 0.2); }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; }
      .modal-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
      .modal-body { padding: 6px 20px 4px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 20px 20px; }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 70;
        padding: 9px 16px;
        border-radius: 999px;
        background: #12141a;
        color: #fff;
        font-size: 12px;
        opacity: 0;
        transform: translate(-50%, 8px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- login ---------- */
      body.auth .sidebar, body.auth .topbar { display: none; }
      body.auth .content { padding: 0; }

      .login { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100vh; }
      .login-art {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px;
        background:
          radial-gradient(circle at 20% 20%, rgba(79, 70, 229, 0.5), transparent 45%),
          radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.35), transparent 45%),
          #12141a;
        color: #fff;
        overflow: hidden;
      }
      .login-art::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
      }
      .login-brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; font-weight: 600; }
      .login-quote { position: relative; z-index: 1; max-width: 420px; }
      .login-quote h2 { margin: 0; font-size: 30px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
      .login-quote p { margin: 12px 0 0; font-size: 13px; color: rgba(255, 255, 255, 0.55); line-height: 1.7; }
      .login-form-wrap { display: grid; place-items: center; padding: 40px; background: var(--surface); }
      .login-form { width: 100%; max-width: 340px; }
      .login-form h1 { margin: 0; font-size: 24px; font-weight: 600; }
      .login-form > p { margin: 6px 0 24px; font-size: 13px; color: var(--muted); }
      .login-form .field { margin-bottom: 14px; }
      .login-form .input { height: 38px; }
      .login-form .primary-btn { width: 100%; justify-content: center; height: 38px; margin-top: 6px; }

      /* ---------- motion ---------- */
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes grow { to { width: var(--w); } }
      .rise { animation: rise 0.46s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

      /* =========================================================
         v2 — motion system & visual polish
         ========================================================= */

      /* ---------- base ---------- */
      body {
        background-image:
          radial-gradient(900px 520px at 8% -12%, rgba(99, 102, 241, 0.1), transparent 62%),
          radial-gradient(760px 520px at 102% 4%, rgba(168, 85, 247, 0.07), transparent 60%);
        background-attachment: fixed;
      }
      body.auth { background: var(--surface); }
      ::selection { background: rgba(79, 70, 229, 0.18); }
      :focus-visible { outline: 2px solid rgba(79, 70, 229, 0.55); outline-offset: 2px; }

      * { scrollbar-width: thin; scrollbar-color: rgba(18, 20, 26, 0.18) transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: rgba(18, 20, 26, 0.16) padding-box;
      }
      *::-webkit-scrollbar-thumb:hover { background: rgba(18, 20, 26, 0.28) padding-box; }

      @property --ring-p {
        syntax: "<number>";
        inherits: false;
        initial-value: 0;
      }

      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } }
      @keyframes fadeIn { from { opacity: 0; } }
      @keyframes popIn { from { opacity: 0; transform: scale(0.9); } }
      @keyframes chipOut { to { opacity: 0; transform: scale(0.82); } }
      @keyframes drift {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to { transform: translate3d(18px, 24px, 0) scale(1.14); }
      }
      @keyframes floatY { from { transform: translateY(0); } to { transform: translateY(-14px); } }
      @keyframes pulseDot {
        0% { transform: scale(0.8); opacity: 0.55; }
        70%, 100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes ringFill { from { --ring-p: 0; } }
      @keyframes genSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(290%); }
      }
      @keyframes pulseOpacity { 50% { opacity: 0.4; } }

      /* ---------- entrance ---------- */
      .page-head,
      .panel,
      .tile,
      .login-quote,
      .login-form {
        animation: fadeUp 0.55s var(--ease) backwards;
        animation-delay: var(--d, 0ms);
      }

      .bento > *:nth-child(1) { --d: 40ms; }
      .bento > *:nth-child(2) { --d: 100ms; }
      .bento > *:nth-child(3) { --d: 160ms; }
      .bento > *:nth-child(4) { --d: 220ms; }

      .studio-col > .tile:nth-child(1) { --d: 50ms; }
      .studio-col > .tile:nth-child(2) { --d: 90ms; }
      .studio-col > .tile:nth-child(3) { --d: 130ms; }
      .studio-col > .tile:nth-child(4) { --d: 170ms; }
      .studio-col > .tile:nth-child(5) { --d: 210ms; }
      .studio-main > :nth-child(1) { --d: 140ms; }
      .studio-main > :nth-child(2) { --d: 220ms; }
      .settings > :nth-child(1), .roles > :nth-child(1) { --d: 60ms; }
      .settings > :nth-child(2), .roles > :nth-child(2) { --d: 120ms; }
      .settings > :nth-child(3) { --d: 180ms; }

      .drawer.open .drawer-head { animation: fadeIn 0.35s var(--ease) backwards; }
      .drawer.open .drawer-body > * { animation: fadeUp 0.4s var(--ease) backwards; }
      .drawer.open .drawer-body > *:nth-child(2) { animation-delay: 50ms; }
      .drawer.open .drawer-body > *:nth-child(3) { animation-delay: 90ms; }
      .drawer.open .drawer-body > *:nth-child(4) { animation-delay: 130ms; }
      .drawer.open .drawer-body > *:nth-child(5) { animation-delay: 170ms; }

      .swap { animation: fadeUp 0.35s var(--ease) backwards; }

      /* ---------- sidebar ---------- */
      .sidebar {
        background: rgba(255, 255, 255, 0.84);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border-right-color: rgba(18, 20, 26, 0.07);
      }

      .logo {
        background: var(--accent-grad);
        box-shadow: 0 8px 18px -6px rgba(79, 70, 229, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }

      .nav-item {
        position: relative;
        transition: background 0.18s var(--ease), color 0.18s var(--ease), transform 0.18s var(--ease);
      }
      .nav-item::before {
        content: "";
        position: absolute;
        left: -2px;
        top: 50%;
        width: 3px;
        height: 0;
        border-radius: 99px;
        background: var(--accent);
        transform: translateY(-50%);
        transition: height 0.25s var(--spring);
      }
      .nav-item.active::before { height: 18px; }
      .nav-item:hover { transform: translateX(2px); }
      .nav-item.active {
        background: linear-gradient(90deg, rgba(79, 70, 229, 0.14), rgba(79, 70, 229, 0.05));
      }
      .nav-item svg { transition: transform 0.25s var(--spring); }
      .nav-item:hover svg { transform: scale(1.08); }
      body.collapsed .nav-item:hover { transform: none; }

      .avatar {
        background: var(--accent-grad);
        color: #fff;
        box-shadow: 0 4px 10px -4px rgba(79, 70, 229, 0.6);
      }
      .user-box { transition: background 0.2s var(--ease); }
      .user-box:hover { background: rgba(18, 20, 26, 0.03); }

      .collapse-btn svg { transition: transform 0.25s var(--spring); }
      body.collapsed .collapse-btn svg { transform: rotate(180deg); }

      /* ---------- topbar ---------- */
      .topbar { transition: box-shadow 0.3s var(--ease), background 0.3s var(--ease); }
      .topbar.scrolled {
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 10px 30px -18px rgba(18, 20, 26, 0.35);
      }

      .search {
        cursor: pointer;
        transition: background 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease);
      }
      .search:hover {
        background: rgba(18, 20, 26, 0.065);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(18, 20, 26, 0.04);
      }
      .search:hover kbd { color: var(--muted); }

      .icon-btn[aria-label="通知"] { position: relative; }
      .icon-btn[aria-label="通知"]::after {
        content: "";
        position: absolute;
        top: 7px;
        right: 8px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f43f5e;
        box-shadow: 0 0 0 2px #fff;
        animation: badgePop 0.45s 0.6s var(--spring) backwards;
      }
      @keyframes badgePop { from { opacity: 0; transform: scale(0.3); } }

      /* ---------- typography ---------- */
      .page-head h1 { font-size: 21px; letter-spacing: -0.02em; }

      /* ---------- buttons ---------- */
      .primary-btn {
        background: var(--accent-grad);
        box-shadow: 0 8px 18px -10px rgba(79, 70, 229, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.22);
        transition: transform 0.2s var(--spring), box-shadow 0.25s var(--ease), filter 0.2s var(--ease);
      }
      .primary-btn:hover {
        transform: translateY(-1.5px);
        opacity: 1;
        filter: saturate(1.06);
        box-shadow: 0 14px 26px -12px rgba(79, 70, 229, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }
      .primary-btn:active { transform: translateY(0) scale(0.985); }
      .primary-btn:disabled { opacity: 0.7; cursor: progress; transform: none; filter: none; }

      .ghost-btn {
        transition: background 0.18s var(--ease), border-color 0.18s var(--ease),
          color 0.18s var(--ease), transform 0.18s var(--spring);
      }
      .ghost-btn:hover {
        background: #fff;
        border-color: rgba(79, 70, 229, 0.28);
        color: var(--text);
        transform: translateY(-1px);
      }
      .ghost-btn:active { transform: translateY(0) scale(0.99); }

      .icon-btn { transition: background 0.18s var(--ease), color 0.18s var(--ease), transform 0.18s var(--spring); }
      .icon-btn:hover { transform: translateY(-1px); }
      .icon-btn:active { transform: scale(0.94); }

      .segmented { padding: 4px; border: 1px solid rgba(18, 20, 26, 0.05); }
      .segmented button { transition: background 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease); }
      .segmented button:hover { color: var(--text); background: rgba(18, 20, 26, 0.035); }
      .segmented .on {
        background: #fff;
        color: var(--accent);
        box-shadow: 0 2px 8px rgba(18, 20, 26, 0.1), inset 0 0 0 1px rgba(79, 70, 229, 0.14);
      }

      /* ---------- tiles / hero ---------- */
      .tile {
        border-color: rgba(18, 20, 26, 0.055);
        box-shadow: var(--shadow-sm);
        transition: box-shadow 0.3s var(--ease), border-color 0.3s var(--ease), transform 0.3s var(--ease);
      }

      .hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #fff 0%, #eef0ff 48%, #f5edff 100%);
      }
      .hero::before {
        content: "";
        position: absolute;
        width: 340px;
        height: 340px;
        right: -90px;
        top: -150px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.28), transparent 66%);
        filter: blur(8px);
        animation: drift 14s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(79, 70, 229, 0.1) 1px, transparent 1px);
        background-size: 18px 18px;
        -webkit-mask-image: radial-gradient(circle at 85% 6%, #000 0%, transparent 44%);
        mask-image: radial-gradient(circle at 85% 6%, #000 0%, transparent 44%);
        opacity: 0.55;
        pointer-events: none;
      }
      .hero > * { position: relative; z-index: 1; }
      .hero-value { font-size: 34px; letter-spacing: -0.03em; }
      .pill {
        background: rgba(79, 70, 229, 0.12);
        color: #3730a3;
        box-shadow: inset 0 0 0 1px rgba(79, 70, 229, 0.16);
      }

      /* ---------- chart ---------- */
      .chart svg { overflow: visible; }
      .chart .grid line {
        stroke: rgba(18, 20, 26, 0.065);
        stroke-width: 1;
        stroke-dasharray: 3 5;
      }
      .chart .area { animation: fadeIn 0.9s 0.35s var(--ease) backwards; }
      .line {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 1.1s var(--ease) 0.05s forwards;
      }
      .chart-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: popIn 0.45s var(--spring) backwards;
        animation-delay: var(--d, 0.4s);
      }
      .chart-pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseDot 2.4s var(--ease) 1.3s infinite;
      }

      /* ---------- kpi ---------- */
      .kpi { position: relative; overflow: hidden; }
      .kpi::after {
        content: "";
        position: absolute;
        right: -34px;
        top: -34px;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.13), transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      .kpi > * { position: relative; z-index: 1; }
      .kpi:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
        border-color: rgba(79, 70, 229, 0.18);
      }
      .kpi .value { font-size: 25px; letter-spacing: -0.02em; }
      .kpi .label { position: relative; z-index: 1; }
      .kpi .spark {
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: 70px;
        height: 24px;
        color: var(--accent);
        opacity: 0.42;
        transition: opacity 0.25s var(--ease);
      }
      .kpi:hover .spark { opacity: 0.85; }
      .spark path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 1.2s var(--ease) 0.35s forwards;
      }

      /* ---------- status bars ---------- */
      .status { display: flex; flex-direction: column; }
      .status-row { grid-template-columns: 74px minmax(0, 1fr) 36px; }
      .status-row .name { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
      .status-row .dot {
        width: 7px;
        height: 7px;
        flex-shrink: 0;
        border-radius: 50%;
        box-shadow: 0 0 0 3px rgba(18, 20, 26, 0.035);
      }
      .stacked {
        display: flex;
        gap: 2px;
        height: 10px;
        margin-top: 14px;
        border-radius: 999px;
        overflow: hidden;
      }
      .stacked i {
        height: 100%;
        border-radius: 99px;
        transform-origin: left center;
        animation: stackIn 0.7s var(--ease) backwards;
        animation-delay: var(--d, 0.25s);
      }
      @keyframes stackIn { from { transform: scaleX(0); opacity: 0.35; } }
      .status-note {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(16, 185, 129, 0.07);
        color: #047857;
        font-size: 11.5px;
      }
      .status-note i {
        width: 6px;
        height: 6px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }
      .status-note p { margin: 0; }
      .status-foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 12px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .status-foot b {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }
      .track {
        background: rgba(18, 20, 26, 0.055);
        box-shadow: inset 0 1px 2px rgba(18, 20, 26, 0.05);
      }
      .track i {
        animation: grow 0.95s var(--ease) var(--d, 0.2s) forwards;
        box-shadow: 0 0 10px -2px rgba(79, 70, 229, 0.25);
      }

      /* ---------- recent list ---------- */
      .recent-list li {
        border-radius: 10px;
        transition: background 0.18s var(--ease), transform 0.18s var(--ease);
      }
      .recent-list li:hover { transform: translateX(3px); background: rgba(79, 70, 229, 0.045); }
      .score { padding: 2px 8px; border-radius: 999px; background: rgba(18, 20, 26, 0.04); }
      .tag { box-shadow: inset 0 0 0 1px rgba(18, 20, 26, 0.03); }

      /* ---------- tables ---------- */
      .panel { box-shadow: var(--shadow-sm); }
      thead th {
        background: rgba(248, 249, 252, 0.92);
        font-size: 11px;
        letter-spacing: 0.03em;
      }
      tbody tr { animation: fadeUp 0.45s var(--ease) backwards; }
      tbody tr:nth-child(1) { animation-delay: 30ms; }
      tbody tr:nth-child(2) { animation-delay: 60ms; }
      tbody tr:nth-child(3) { animation-delay: 90ms; }
      tbody tr:nth-child(4) { animation-delay: 120ms; }
      tbody tr:nth-child(5) { animation-delay: 150ms; }
      tbody tr:nth-child(6) { animation-delay: 180ms; }
      tbody tr:nth-child(7) { animation-delay: 210ms; }
      tbody tr:nth-child(8) { animation-delay: 240ms; }
      tbody tr:hover { background: rgba(79, 70, 229, 0.035); }
      tbody td:first-child { box-shadow: inset 2px 0 0 transparent; transition: box-shadow 0.18s var(--ease); }
      tbody tr:hover td:first-child { box-shadow: inset 2px 0 0 var(--accent); }

      .mini-avatar {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-right: 9px;
        vertical-align: middle;
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.16), rgba(168, 85, 247, 0.12));
        color: #4338ca;
        font-size: 11px;
        font-weight: 600;
      }
      .user-cell { display: flex; align-items: center; }
      .user-cell b, .user-cell small { line-height: 1.35; }

      .pages button { transition: background 0.18s var(--ease), color 0.18s var(--ease), transform 0.18s var(--spring); }
      .pages button:hover { transform: translateY(-1px); }
      .pages .on { box-shadow: 0 2px 8px -2px rgba(79, 70, 229, 0.4); }
      .empty-row td { padding: 34px 14px; text-align: center; color: var(--faint); }

      /* ---------- inputs ---------- */
      .input, .select { transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease); }
      .input:hover, .select:hover { border-color: rgba(18, 20, 26, 0.18); }
      .input:focus, .select:focus { box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

      .select {
        -webkit-appearance: none;
        appearance: none;
        padding-right: 30px;
        background-color: var(--surface);

              var decimals = (body.split('.')[1] || '').length;
              var grouped = body.indexOf(',') >= 0;
              var started = performance.now();
              var duration = 900;
              function frame(now) {
                var t = Math.min(1, (now - started) / duration);
                var eased = 1 - Math.pow(1 - t, 3);

        /* ---------------- chart ---------------- */
        function drawChart() {
          var el = $('#chart');
          if (!el) return;
          var data = [52, 61, 58, 74, 69, 83, 78, 91, 86, 97, 92, 108, 101, 118];
          var width = 720, height = 200, padX = 14, padY = 18;
          var max = Math.max.apply(null, data), min = Math.min.apply(null, data);
          var span = max - min || 1, innerW = width - padX * 2, innerH = height - padY * 2;
          var points = data.map(function (v, i) {
            return [padX + (innerW * i) / (data.length - 1), padY + innerH - ((v - min) / span) * innerH];
          });
          var line = points.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
          var last = points[points.length - 1], first = points[0], base = height - 8;
          var area = line + ' L' + last[0].toFixed(1) + ' ' + base.toFixed(1) +
            ' L' + first[0].toFixed(1) + ' ' + base.toFixed(1) + ' Z';
          var grid = '';
          for (var g = 0; g <= 4; g++) {
            var y = (padY + (innerH * g) / 4).toFixed(1);
            grid += '<line x1="0" y1="' + y + '" x2="' + width + '" y2="' + y + '" vector-effect="non-scaling-stroke"></line>';
          }
          var dots = points.map(function (p, i) {
            return '<circle class="chart-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
              '" r="2.8" fill="#fff" stroke="#4f46e5" stroke-width="1.8" style="--d:' + (420 + i * 55) + 'ms"></circle>';
          }).join('');
          el.innerHTML = '<svg viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" role="img" aria-label="近 14 天生成趋势">' +
            '<defs><linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0" stop-color="#4f46e5" stop-opacity="0.22"></stop>' +
              '<stop offset="1" stop-color="#4f46e5" stop-opacity="0"></stop>' +
            '</linearGradient></defs>' +
            '<g class="grid">' + grid + '</g>' +
            '<path class="area" d="' + area + '" fill="url(#chartArea)"></path>' +
            '<path class="line" d="' + line + '" pathLength="1" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>' +
            dots +
            '<circle class="chart-pulse" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4.5" fill="none" stroke="#4f46e5" stroke-width="1.5"></circle>' +
            '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3.6" fill="#4f46e5"></circle>' +
            '</svg>';
        }

          var action = el.getAttribute('data-action');

          if (action === 'drawer') {
            openDrawer(el.getAttribute('data-id'));
          } else if (action === 'close-drawer') {
            closeDrawer();
          } else if (action === 'dtab') {
            currentTab = el.getAttribute('data-tab');
            renderDrawer();
          } else if (action === 'open-modal') {
            openModal(el.getAttribute('data-modal'));
          } else if (action === 'close-modal') {
            closeModal();
          } else if (action === 'toast') {
            toast(el.getAttribute('data-message') || '已完成');
          } else if (action === 'go') {
            location.hash = '#' + el.getAttribute('data-route');
          } else if (action === 'agent') {
            var list = document.querySelectorAll('.agent');
            for (var i = 0; i < list.length; i++) list[i].classList.remove('active');
            el.classList.add('active');
          } else if (action === 'remove-keyword') {
            var chip = el.parentNode;
            chip.classList.add('removing');
            setTimeout(function () {
              if (chip.parentNode) chip.parentNode.removeChild(chip);
            }, 200);
          } else if (action === 'add-keyword') {
            var input = $('#keyword-input');
            var value = input.value.trim();
            if (!value) return;
            var chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = value + '<button type="button" data-action="remove-keyword">×</button>';
            $('#chips').appendChild(chip);
            input.value = '';
          } else if (action === 'generate') {
            var canvas = $('#canvas');
            if (!canvas || canvas.classList.contains('generating')) return;
            var originalLabel = el.textContent;
            canvas.classList.add('generating');
            el.disabled = true;
            el.textContent = '生成中…';
            toast('已提交生成任务，画布将在原地更新');
            setTimeout(function () {
              canvas.classList.remove('generating');
              el.disabled = false;
              el.textContent = originalLabel;
              toast('生成完成，评分已更新');
            }, 1900);
          } else if (action === 'settings-tab') {
            var tabs = document.querySelectorAll('[data-action="settings-tab"]');
            for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('on');
            el.classList.add('on');
            var tab = el.getAttribute('data-tab');
            var promptPane = $('#settings-prompt');
            var rulesPane = $('#settings-rules');
            promptPane.style.display = tab === 'prompt' ? '' : 'none';
            rulesPane.style.display = tab === 'rules' ? '' : 'none';
            var shownPane = tab === 'prompt' ? promptPane : rulesPane;
            shownPane.classList.remove('swap');
            void shownPane.offsetWidth;
            shownPane.classList.add('swap');
          } else if (action === 'segment') {
            var segButtons = el.parentNode.querySelectorAll('button');
            for (var s = 0; s < segButtons.length; s++) segButtons[s].classList.remove('on');
            el.classList.add('on');
            toast('已切换时间范围（原型）');
          } else if (action === 'save-settings') {
            toast('配置已保存');
          } else if (action === 'role') {
            activeRole = el.getAttribute('data-role');
            var roleButtons = document.querySelectorAll('.role');
            for (var k = 0; k < roleButtons.length; k++) roleButtons[k].classList.remove('on');
            el.classList.add('on');
            var active = roles.filter(function (r) { return r.name === activeRole; })[0];
            var panel = $('#perm-panel');
            if (panel && active) panel.innerHTML = permissionHtml(active);
          } else if (action === 'save-role') {
            toast('授权已保存');
          } else if (action === 'toggle-menu') {
            var group = el.getAttribute('data-group');
            var rows = document.querySelectorAll('[data-menu-row][data-group="' + group + '"]');
            for (var m = 0; m < rows.length; m++) {
              rows[m].style.display = rows[m].style.display === 'none' ? '' : 'none';
            }
            el.textContent = el.textContent === '▾' ? '▸' : '▾';
          }
        });

        document.addEventListener('input', function (event) {
          if (event.target && event.target.id === 'word-range') {
            var output = $('#word-value');
            if (output) output.textContent = event.target.value;
          }
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            closeDrawer();
            closeModal();
          }
          if (event.key === 'Enter' && event.target && event.target.id === 'keyword-input') {
            event.preventDefault();
            var btn = document.querySelector('[data-action="add-keyword"]');
            if (btn) btn.click();
          }
        });

        document.addEventListener('submit', function (event) {
          if (event.target && event.target.id === 'modal-form') {
            event.preventDefault();
            closeModal();
            toast('已创建');
          }
          if (event.target && event.target.id === 'login-form') {
            event.preventDefault();
            location.hash = '#/';
            toast('已登录（原型）');
          }
        });

        $('#overlay').addEventListener('click', closeDrawer);
        $('#modal').addEventListener('click', function (event) {
          if (event.target === $('#modal')) closeModal();
        });

        $('#collapse-btn').addEventListener('click', function () {
          document.body.classList.toggle('collapsed');
        });

        var topbarEl = $('.topbar');
        function onScroll() {
          if (topbarEl) topbarEl.classList.toggle('scrolled', window.scrollY > 4);
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        var searchEl = $('.search');
        if (searchEl) {
          searchEl.addEventListener('click', function () {
            toast('打开全局搜索（原型占位）');
          });
        }

        document.addEventListener('keydown', function (event) {
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
            event.preventDefault();
            toast('打开全局搜索（原型占位）');
          }
        });

        window.addEventListener('hashchange', render);
        render();
      })();
    </script>
  </body>
</html>
