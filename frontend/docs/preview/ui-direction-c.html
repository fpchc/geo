      /* ---------------- theme ---------------- */
      var rootEl = document.documentElement;
      var THEME_KEY = 'geo-studio-theme';
      var storedTheme = null;
      try {
        storedTheme = localStorage.getItem(THEME_KEY);
      } catch (error) {
        storedTheme = null;
      }
      var prefersDark =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (storedTheme === 'dark' || (storedTheme === null && prefersDark)) {
        rootEl.classList.add('dark');
      }

      var themeToggle = $('#theme-toggle');
      function syncThemeButton() {
        if (!themeToggle) return;
        var dark = rootEl.classList.contains('dark');
        var label = dark ? '切换到浅色主题' : '切换到深色主题';
        themeToggle.setAttribute('aria-pressed', String(dark));
        themeToggle.setAttribute('aria-label', label);
        themeToggle.setAttribute('title', label);
      }
      if (themeToggle) {
        syncThemeButton();
        themeToggle.addEventListener('click', function () {
          var dark = rootEl.classList.toggle('dark');
          try {
            localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
          } catch (error) {
            /* localStorage may be unavailable on file:// */
          }
          syncThemeButton();
        });
      }

      /* ---------------- user menu ---------------- */
      var userMenuBtn = $('#user-menu-btn');
      var userPopover = $('#user-popover');

      function closeUserMenu() {
        if (!userPopover) return;
        userPopover.classList.remove('open');
        if (userMenuBtn) userMenuBtn.setAttribute('aria-expanded', 'false');
      }

      function toggleUserMenu() {
        if (!userPopover) return;
        var open = userPopover.classList.toggle('open');
        if (userMenuBtn) userMenuBtn.setAttribute('aria-expanded', String(open));
      }

      /* ---------------- motion / gsap ---------------- */
      var M = null;
      var gsapLib = window.gsap || null;
      var ScrollTriggerLib = window.ScrollTrigger || null;
      var easeOut = [0.22, 0.61, 0.36, 1];

      if (gsapLib && ScrollTriggerLib) {
        gsapLib.registerPlugin(ScrollTriggerLib);
      }

      if (!reduceMotion) {
        import('https://esm.sh/motion@12')
          .then(function (mod) {
            M = mod;
          })
          .catch(function () {
            M = null;
          });
      }

      function mAnim(target, keyframes, options) {
        if (!M || reduceMotion) return null;
        try {
          return M.animate(target, keyframes, options);
        } catch (error) {
          return null;
        }
      }

      function mNumber(from, to, options) {
        if (!M || reduceMotion) return null;
        try {
          return M.animate(from, to, options);
        } catch (error) {
          return null;
        }
      }

      function mStagger(value) {
        if (!M || !M.stagger) return value || 0;
        return M.stagger(value);
      }

      /* ---------------- number counter (Motion) ---------------- */
      function animateNumbers(root) {
        if (reduceMotion) return;
        $$('[data-count]', root).forEach(function (el) {
          if (el.getAttribute('data-counted') === '1') return;
          el.setAttribute('data-counted', '1');
          var raw = el.textContent.trim();
          var match = raw.match(/^([^\d+-]*)([+-]?[\d,]+(?:\.\d+)?)(.*)$/);
          if (!match) return;
          var prefix = match[1];
          var body = match[2];
          var suffix = match[3];
          var target = parseFloat(body.replace(/,/g, ''));
          if (!isFinite(target)) return;
          var decimals = (body.split('.')[1] || '').length;
          var grouped = body.indexOf(',') >= 0;

          var render = function (value) {
            var text = grouped
              ? value.toLocaleString('en-US', {
                  minimumFractionDigits: decimals,
                  maximumFractionDigits: decimals
                })
              : value.toFixed(decimals);
            el.textContent = prefix + text + suffix;
          };

          if (M) {
            mNumber(0, target, {
              duration: 0.9,
              ease: [0.33, 1, 0.68, 1],
              onUpdate: render
            });
          } else {
            var started = performance.now();
            var frame = function (now) {
              var t = Math.min(1, (now - started) / 900);
              var eased = 1 - Math.pow(1 - t, 3);
              render(target * eased);
              if (t < 1) requestAnimationFrame(frame);
              else el.textContent = raw;
            };
            requestAnimationFrame(frame);
          }
        });
      }

      /* ---------------- segmented control (Motion layout) ---------------- */
      function syncSegThumb(seg) {
        var on = seg.querySelector('.seg-btn.is-on');
        var thumb = seg.querySelector('.seg-thumb');
        if (!on || !thumb) return;
        var width = on.offsetWidth;
        var x = on.offsetLeft;
        if (M && !reduceMotion) {
          mAnim(thumb, { width: width, x: x }, { type: 'spring', stiffness: 420, damping: 34 });
        } else {
          thumb.style.width = width + 'px';
          thumb.style.transform = 'translateX(' + x + 'px)';
        }
      }

      function syncAllSegments() {
        $$('[data-segmented]').forEach(syncSegThumb);
      }

      /* ---------------- ring (GSAP timeline) ---------------- */
      function animateRing(root) {
        $$('.ring', root || document).forEach(function (ring) {
          var target = parseFloat(ring.getAttribute('data-p') || '0');
          if (gsapLib && !reduceMotion) {
            gsapLib.fromTo(
              ring,
              { '--ring-p': 0 },
              { '--ring-p': target, duration: 1.15, ease: 'power3.out', delay: 0.15 }
            );
          } else {
            ring.style.setProperty('--ring-p', target);
          }
        });
      }

      /* ---------------- trend chart (GSAP timeline) ---------------- */
      function drawChart() {
        var el = $('#chart');
        if (!el) return;
        var data = [52, 61, 58, 74, 69, 83, 78, 91, 86, 97, 92, 108, 101, 118];
        var width = 720;
        var height = 200;
        var padX = 14;
        var padY = 18;
        var max = Math.max.apply(null, data);
        var min = Math.min.apply(null, data);
        var span = max - min || 1;
        var innerW = width - padX * 2;
        var innerH = height - padY * 2;
        var points = data.map(function (v, i) {
          return [padX + (innerW * i) / (data.length - 1), padY + innerH - ((v - min) / span) * innerH];
        });
        var line = points
          .map(function (p, i) {
            return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
          })
          .join(' ');
        var last = points[points.length - 1];
        var first = points[0];
        var base = height - 8;
        var area =
          line +
          ' L' + last[0].toFixed(1) + ' ' + base.toFixed(1) +
          ' L' + first[0].toFixed(1) + ' ' + base.toFixed(1) + ' Z';
        var grid = '';
        for (var g = 0; g <= 4; g++) {
          var y = (padY + (innerH * g) / 4).toFixed(1);
          grid += '<line x1="0" y1="' + y + '" x2="' + width + '" y2="' + y + '" vector-effect="non-scaling-stroke"></line>';
        }
        var dots = points
          .map(function (p, i) {
            return '<circle class="chart-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.8" stroke-width="1.8" style="fill:var(--card);stroke:var(--chart-line)"></circle>';
          })
          .join('');

        el.innerHTML =
          '<svg viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" role="img" aria-label="近 14 天生成趋势">' +
            '<defs><linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0" stop-opacity="0.22" style="stop-color:var(--chart-line)"></stop>' +
              '<stop offset="1" stop-opacity="0" style="stop-color:var(--chart-line)"></stop>' +
            '</linearGradient></defs>' +
            '<g class="grid">' + grid + '</g>' +
            '<path class="chart-area" d="' + area + '" fill="url(#chartArea)"></path>' +
            '<path class="chart-line" d="' + line + '" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--chart-line)"></path>' +
            dots +
            '<circle class="chart-pulse" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4.5" fill="none" stroke-width="1.5" style="stroke:var(--chart-line)"></circle>' +
            '<circle class="chart-end" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3.6" style="fill:var(--chart-line)"></circle>' +
          '</svg>';

        if (!gsapLib || reduceMotion) return;

        var lineEl = el.querySelector('.chart-line');
        var areaEl = el.querySelector('.chart-area');
        var dotEls = el.querySelectorAll('.chart-dot');
        var gridEls = el.querySelectorAll('.grid line');
        var pulseEl = el.querySelector('.chart-pulse');
        var length = lineEl.getTotalLength();

        gsapLib.set(lineEl, { strokeDasharray: length, strokeDashoffset: length });
        gsapLib.set(areaEl, { opacity: 0 });
        gsapLib.set(dotEls, { scale: 0, opacity: 0, transformOrigin: 'center' });
        gsapLib.set(gridEls, { opacity: 0 });
        gsapLib.set(pulseEl, { attr: { r: 4.5, opacity: 0 } });

        gsapLib
          .timeline({ defaults: { ease: 'power2.out' } })
          .to(gridEls, { opacity: 1, duration: 0.5, stagger: 0.04 })
          .to(lineEl, { strokeDashoffset: 0, duration: 1.1 }, 0.1)
          .to(areaEl, { opacity: 1, duration: 0.8 }, 0.35)
          .to(dotEls, { scale: 1, opacity: 1, duration: 0.4, stagger: 0.055, ease: 'back.out(2)' }, 0.4)
          .to(pulseEl, { attr: { r: 4.5, opacity: 1 }, duration: 0.5 }, 0.9)
          .to(pulseEl, { attr: { r: 14, opacity: 0 }, duration: 2.4, repeat: -1, ease: 'power1.out' }, 1.4);
      }

      /* ---------------- scroll choreography (GSAP ScrollTrigger) ---------------- */
      var scrollCtx = null;

      function refreshScroll() {
        if (!gsapLib || !ScrollTriggerLib || reduceMotion) return;
        if (scrollCtx) {
          scrollCtx.revert();
          scrollCtx = null;
        }
        scrollCtx = gsapLib.context(function () {
          var hero = $('.hero');
          if (hero) {
            gsapLib.to('.hero-orb', {
              x: 18,
              scale: 1.14,
              duration: 14,
              ease: 'sine.inOut',
              repeat: -1,
              yoyo: true
            });
            gsapLib.to('.hero-orb', {
              yPercent: 18,
              ease: 'none',
              scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true }
            });
            gsapLib.to('.hero-grid', {
              backgroundPosition: '0px 120px',
              ease: 'none',
              scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true }
            });
          }
          ScrollTriggerLib.refresh();
        });
      }

      /* ---------------- login timeline (GSAP) ---------------- */
      var loginCtx = null;

      function initLogin() {
        if (!gsapLib || reduceMotion) return;
        if (loginCtx) loginCtx.revert();
        loginCtx = gsapLib.context(function () {
          gsapLib
            .timeline({ defaults: { ease: 'power2.out' } })
            .from('.login-brand', { y: 10, opacity: 0, duration: 0.5 })
            .from('.login-quote h2', { y: 16, opacity: 0, duration: 0.6 }, 0.1)
            .from('.login-quote p', { y: 12, opacity: 0, duration: 0.5 }, 0.2)
            .from('.login-points span', { y: 10, opacity: 0, duration: 0.45, stagger: 0.08 }, 0.3)
            .from('.login-form h1', { y: 12, opacity: 0, duration: 0.5 }, 0.15)
            .from('.login-form > p', { y: 12, opacity: 0, duration: 0.5 }, 0.22)
            .from('.login-form .field', { y: 12, opacity: 0, duration: 0.5, stagger: 0.07 }, 0.29)
            .from('.login-form .btn', { y: 12, opacity: 0, duration: 0.5 }, 0.43)
            .from('.orb', { scale: 0.82, opacity: 0, duration: 1.2, stagger: 0.15 }, 0);
          gsapLib.to('.orb-1', { y: -14, duration: 9, ease: 'sine.inOut', repeat: -1, yoyo: true });
          gsapLib.to('.orb-2', { y: -14, duration: 9, ease: 'sine.inOut', repeat: -1, yoyo: true, delay: 3.5 });
        });
      }

      /* ---------------- toast (Motion) ---------------- */
      var toastTimer = null;

      function toast(message) {
        var el = $('#toast');
        el.textContent = message;
        if (M && !reduceMotion) {
          mAnim(
            el,
            { x: '-50%', y: [12, 0], scale: [0.96, 1], opacity: [0, 1] },
            { type: 'spring', stiffness: 420, damping: 30 }
          );
        } else {
          el.style.opacity = '1';
          el.style.transform = 'translate(-50%, 0) scale(1)';
        }
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          if (M && !reduceMotion) {
            mAnim(el, { x: '-50%', y: 12, scale: 0.96, opacity: 0 }, { duration: 0.24, ease: [0.4, 0, 1, 1] });
          } else {
            el.style.opacity = '0';
          }
        }, 2200);
      }

      /* ---------------- drawer ---------------- */
      function openDrawer(id) {
        currentRow = contentRows.filter(function (row) {
          return row.id === id;
        })[0];
        if (!currentRow) return;
        currentTab = 'body';
        renderDrawer();
        $('#overlay').classList.add('open');
        var drawer = $('#drawer');
        drawer.classList.add('open');
        drawer.style.transform = 'translateX(100%)';
        if (M && !reduceMotion) {
          mAnim(drawer, { x: ['100%', '0%'] }, { type: 'spring', stiffness: 300, damping: 32 });
        } else {
          drawer.style.transform = 'translateX(0)';
        }
      }

      function closeDrawer() {
        var drawer = $('#drawer');
        if (!drawer.classList.contains('open')) return;
        $('#overlay').classList.remove('open');
        drawer.classList.remove('open');
        if (M && !reduceMotion) {
          mAnim(drawer, { x: '100%' }, { duration: 0.3, ease: [0.4, 0, 1, 1] });
        } else {
          drawer.style.transform = 'translateX(100%)';
        }
      }

      function renderDrawer() {
        var row = currentRow;
        if (!row) return;
        var tabs = [
          { key: 'body', label: '正文' },
          { key: 'score', label: '评分' },
          { key: 'info', label: '信息' }
        ];
        $('#drawer').innerHTML =
          '<div class="drawer-head"><div><p class="eyebrow">' + row.id + '</p><h2>' + escapeHtml(row.title) + '</h2></div>' +
            '<button type="button" class="icon-btn" data-action="close-drawer" aria-label="关闭">' + icon('x') + '</button></div>' +
          '<div class="tabs">' +
            tabs.map(function (tab) {
              return '<button type="button" class="tab' + (currentTab === tab.key ? ' is-on' : '') + '" data-action="dtab" data-tab="' + tab.key + '">' + tab.label + '</button>';
            }).join('') +
          '</div>' +
          '<div class="drawer-body">' + drawerBody(row, currentTab) + '</div>';

        animateNumbers($('#drawer'));
        animateRing($('#drawer'));

        if (M && !reduceMotion) {
          mAnim(
            $$('#drawer .drawer-body > *'),
            { opacity: [0, 1], y: [10, 0] },
            { delay: mStagger(0.05), duration: 0.38, ease: easeOut }
          );
        }
      }

      /* ---------------- modal ---------------- */
      function openModal(kind) {
        var title = kind === 'menu' ? '新建菜单' : '新建用户';
        var fields =
          kind === 'menu'
            ? '<div class="form-row"><label>菜单名称</label><input class="input" placeholder="例如：数据看板" /></div>' +
              '<div class="form-row"><label>路径</label><input class="input" placeholder="/dashboard/data" /></div>' +
              '<div class="form-row"><label>父级</label><select class="select"><option>内容生产</option><option>系统管理</option></select></div>' +
              '<div class="form-row"><label>图标</label><input class="input" placeholder="Lucide 图标名" /></div>'
            : '<div class="form-row"><label>用户名</label><input class="input" placeholder="lin.zhiyuan" /></div>' +
              '<div class="form-row"><label>显示名</label><input class="input" placeholder="林知远" /></div>' +
              '<div class="form-row"><label>角色</label><select class="select"><option>编辑</option><option>内容运营</option><option>只读</option></select></div>' +
              '<div class="form-row"><label>初始密码</label><input class="input" type="password" placeholder="至少 8 位" /></div>';

        var modalEl = $('#modal');
        clearTimeout(modalEl._hideTimer);
        modalEl.innerHTML =
          '<div class="modal-card">' +
            '<div class="modal-head"><h2>' + title + '</h2>' +
              '<button type="button" class="icon-btn" data-action="close-modal" aria-label="关闭">' + icon('x') + '</button></div>' +
            '<form id="modal-form"><div class="modal-body flex flex-col gap-3.5">' + fields + '</div>' +
              '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">取消</button><button type="submit" class="btn btn-primary">创建</button></div></form>' +
          '</div>';
        modalEl.classList.add('open');

        if (M && !reduceMotion) {
          mAnim(modalEl.firstElementChild, { opacity: [0, 1], y: [14, 0], scale: [0.97, 1] }, { type: 'spring', stiffness: 320, damping: 28 });
        }
      }

      function closeModal() {
        var modalEl = $('#modal');
        if (!modalEl || !modalEl.classList.contains('open')) return;
        modalEl.classList.remove('open');
        clearTimeout(modalEl._hideTimer);

        var card = modalEl.firstElementChild;
        var remove = function () {
          if (!modalEl.classList.contains('open')) modalEl.innerHTML = '';
        };

        if (M && !reduceMotion && card) {
          var anim = mAnim(card, { opacity: 0, y: 10, scale: 0.98 }, { duration: 0.2 });
          if (anim && anim.finished && anim.finished.then) anim.finished.then(remove);
          else modalEl._hideTimer = setTimeout(remove, 240);
        } else {
          modalEl._hideTimer = setTimeout(remove, 240);
        }
      }

      /* ---------------- routing ---------------- */
      var activeRole = '管理员';
      var currentRoute = '/';
      var currentRow = null;
      var currentTab = 'body';

      var routes = {
        '/': { title: '运营概览', group: '内容生产', render: overviewView, after: function () { drawChart(); } },
        '/studio': { title: '内容创作', group: '内容生产', render: studioView, after: function () { animateRing($('#review')); } },
        '/library': { title: '内容库', group: '内容生产', render: libraryView },
        '/settings': { title: '内容配置', group: '内容生产', render: settingsView },
        '/users': { title: '用户管理', group: '系统管理', render: usersView },
        '/roles': { title: '角色管理', group: '系统管理', render: function () { return rolesView(activeRole); } },
        '/menus': { title: '菜单管理', group: '系统管理', render: menusView },
        '/login': { title: '登录', group: '', render: loginView, after: function () { initLogin(); } }
      };

      function routeFromHash() {
        var raw = (location.hash || '#/').replace(/^#/, '');
        if (!raw) raw = '/';
        if (raw.length > 1 && raw.slice(-1) === '/') raw = raw.slice(0, -1);
        return raw;
      }

      function updateNav(route) {
        $$('.nav-item').forEach(function (item) {
          item.classList.toggle('active', item.getAttribute('data-route') === route);
        });
      }

      function render() {
        var route = routeFromHash();
        var page = routes[route] || routes['/'];
        currentRoute = route;

        closeDrawer();
        closeModal();
        closeUserMenu();
        document.body.classList.toggle('auth', route === '/login');

        var view = $('#view');
        view.innerHTML = page.render();

        $('#crumbs').innerHTML = page.group
          ? '<span>' + page.group + '</span><span class="sep">/</span><b>' + page.title + '</b>'
          : '<b>' + page.title + '</b>';

        updateNav(route);
        if (page.after) page.after();
        animateNumbers(view);
        syncAllSegments();
        requestAnimationFrame(syncAllSegments);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncAllSegments);
        if (route === '/library') bindLibrarySearch();
        if (route === '/users') {
          /* 保持与原型的搜索占位一致：输入即过滤用户 */
        }
        window.scrollTo(0, 0);
        refreshScroll();

        if (gsapLib && !reduceMotion) {
          gsapLib.fromTo(view, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', clearProps: 'opacity,transform' });
        }
      }

      function bindLibrarySearch() {
        var input = $('#library-search');
        if (!input) return;
        input.addEventListener('input', function () {
          var body = $('#library-body');
          if (!body) return;
          body.innerHTML = libraryRows(input.value);
          var rows = $$('tr', body);
          if (M && !reduceMotion) {
            mAnim(rows, { opacity: [0, 1], y: [6, 0] }, { duration: 0.25, delay: mStagger(0.02) });
          }
        });
      }

      /* ---------------- event delegation ---------------- */
      document.addEventListener('click', function (event) {
        var el = event.target.closest('[data-action]');
        if (!el) return;
        var action = el.getAttribute('data-action');

        if (action === 'drawer') {
          openDrawer(el.getAttribute('data-id'));
        } else if (action === 'close-drawer') {
          closeDrawer();
        } else if (action === 'dtab') {
          currentTab = el.getAttribute('data-tab');
          renderDrawer();
        } else if (action === 'open-modal') {
          openModal(el.getAttribute('data-modal'));
        } else if (action === 'close-modal') {
          closeModal();
        } else if (action === 'toast') {
          toast(el.getAttribute('data-message') || '已完成');
        } else if (action === 'go') {
          location.hash = '#' + el.getAttribute('data-route');
        } else if (action === 'agent') {
          $$('.agent').forEach(function (item) { item.classList.remove('active'); });
          el.classList.add('active');
          var dot = el.querySelector('.agent-dot');
          if (dot) mAnim(dot, { scale: [0.86, 1.06] }, { type: 'spring', stiffness: 460, damping: 20 });
        } else if (action === 'remove-keyword') {
          var chip = el.closest('.chip');
          if (!chip) return;
          if (M && !reduceMotion) {
            var anim = mAnim(chip, { opacity: 0, scale: 0.82 }, { duration: 0.18 });
            if (anim && anim.finished && anim.finished.then) anim.finished.then(function () { chip.remove(); });
            else chip.remove();
          } else {
            chip.remove();
          }
        } else if (action === 'add-keyword') {
          var input = $('#keyword-input');
          var value = input.value.trim();
          if (!value) return;
          var newChip = document.createElement('span');
          newChip.className = 'chip';
          newChip.innerHTML = escapeHtml(value) + '<button type="button" data-action="remove-keyword">×</button>';
          $('#chips').appendChild(newChip);
          mAnim(newChip, { opacity: [0, 1], scale: [0.8, 1] }, { type: 'spring', stiffness: 500, damping: 26 });
          input.value = '';
        } else if (action === 'generate') {
          var canvas = $('#canvas');
          if (!canvas || canvas.classList.contains('generating')) return;
          var originalLabel = el.textContent;
          canvas.classList.add('generating');
          el.disabled = true;
          el.textContent = '生成中…';
          toast('已提交生成任务，画布将在原地更新');
          setTimeout(function () {
            canvas.classList.remove('generating');
            el.disabled = false;
            el.textContent = originalLabel;
            toast('生成完成，评分已更新');
          }, 1900);
        } else if (action === 'settings-tab') {
          $$('[data-action="settings-tab"]').forEach(function (tab) { tab.classList.remove('is-on'); });
          el.classList.add('is-on');
          var tabKey = el.getAttribute('data-tab');
          var promptPane = $('#settings-prompt');
          var rulesPane = $('#settings-rules');
          promptPane.classList.toggle('hidden', tabKey !== 'prompt');
          rulesPane.classList.toggle('hidden', tabKey !== 'rules');
          var shown = tabKey === 'prompt' ? promptPane : rulesPane;
          shown.classList.remove('swap');
          void shown.offsetWidth;
          shown.classList.add('swap');
          mAnim(shown, { opacity: [0, 1], y: [8, 0] }, { duration: 0.3, ease: easeOut });
        } else if (action === 'segment') {
          var seg = el.parentNode;
          $$('.seg-btn', seg).forEach(function (btn) { btn.classList.remove('is-on'); });
          el.classList.add('is-on');
          syncSegThumb(seg);
          toast('已切换时间范围（原型）');
        } else if (action === 'save-settings') {
          toast('配置已保存');
        } else if (action === 'role') {
          activeRole = el.getAttribute('data-role');
          $$('.role').forEach(function (btn) {
            btn.classList.toggle('is-on', btn.getAttribute('data-role') === activeRole);
          });
          var active = roles.filter(function (r) { return r.name === activeRole; })[0];
          var panel = $('#perm-panel');
          if (panel && active) {
            panel.innerHTML = permissionHtml(active);
            mAnim(panel, { opacity: [0, 1], y: [8, 0] }, { duration: 0.3, ease: easeOut });
          }
        } else if (action === 'save-role') {
          toast('授权已保存');
        } else if (action === 'toggle-menu') {
          var group = el.getAttribute('data-group');
          var rows = $$('[data-menu-row][data-group="' + group + '"]');
          rows.forEach(function (row) { row.classList.toggle('hidden'); });
          el.textContent = el.textContent === '▾' ? '▸' : '▾';
        } else if (action === 'toggle-user-menu') {
          toggleUserMenu();
        } else if (action === 'logout') {
          closeUserMenu();
          toast('已退出登录（原型）');
        }
      });

      document.addEventListener('input', function (event) {
        if (event.target && event.target.id === 'word-range') {
          var output = $('#word-value');
          if (output) output.textContent = event.target.value;
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeDrawer();
          closeModal();
          closeUserMenu();
        }
        if (event.key === 'Enter' && event.target && event.target.id === 'keyword-input') {
          event.preventDefault();
          var addBtn = $('[data-action="add-keyword"]');
          if (addBtn) addBtn.click();
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          toast('打开全局搜索（原型占位）');
        }
      });

      document.addEventListener('submit', function (event) {
        if (event.target && event.target.id === 'modal-form') {
          event.preventDefault();
          closeModal();
          toast('已创建');
        }
        if (event.target && event.target.id === 'login-form') {
          event.preventDefault();
          location.hash = '#/';
          toast('已登录（原型）');
        }
      });

      $('#overlay').addEventListener('click', closeDrawer);
      $('#modal').addEventListener('click', function (event) {
        if (event.target === $('#modal')) closeModal();
      });

      document.addEventListener('click', function (event) {
        if (!userPopover || !userPopover.classList.contains('open')) return;
        if (event.target.closest('#user-menu')) return;
        closeUserMenu();
      });

      var collapseBtn = $('#collapse-btn');
      if (collapseBtn) {
        collapseBtn.addEventListener('click', function () {
          var collapsed = document.body.classList.toggle('collapsed');
          var label = collapsed ? '展开侧边栏' : '收起侧边栏';
          collapseBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
          collapseBtn.setAttribute('aria-label', label);
          collapseBtn.setAttribute('title', label);
        });
      }

      var searchEl = $('#global-search');
      if (searchEl) {
        searchEl.addEventListener('click', function () {
          toast('打开全局搜索（原型占位）');
        });
      }

      var topbarEl = $('.topbar');
      function onScroll() {
        if (topbarEl) topbarEl.classList.toggle('scrolled', window.scrollY > 4);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      window.addEventListener('resize', function () {
        syncAllSegments();
        if (ScrollTriggerLib) ScrollTriggerLib.refresh();
      });

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
